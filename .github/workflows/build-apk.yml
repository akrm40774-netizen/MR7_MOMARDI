
name: Build MR7 Momaredi APK

on:
  push:
    paths:
      - 'mr7-ممرّضي.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36-ext1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          mkdir project
          unzip -q 'mr7-ممرّضي.zip' -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Build APK
        run: gradle -p project assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR7-Momaredi-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
