name: MR7 Momaredi APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'mr7-ممرّضي.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p project
          unzip -q "mr7-ممرّضي.zip" -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Inject Gemini build secret
        shell: bash
        env:
          GEMINI_MR7_VERSION_API_KEY: ${{ secrets.GEMINI_MR7_VERSION_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_MR7_VERSION_API_KEY:-}" ]]; then
            echo "::error::Missing repository secret GEMINI_MR7_VERSION_API_KEY."
            exit 1
          fi

          umask 077
          printf 'GEMINI_MR7_VERSION_API_KEY=%s\n' "$GEMINI_MR7_VERSION_API_KEY" > project/.env
          printf 'GEMINI_MR7_VERSION_API_=%s\n' "$GEMINI_MR7_VERSION_API_KEY" >> project/.env
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_MR7_VERSION_API_KEY" >> project/.env
          chmod 600 project/.env

      - name: Create debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore project/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p project assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find project/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR7-Momaredi-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
